<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pneumonia Detection AI - Medical Diagnostics</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #0f1419;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .header {
        text-align: center;
        color: #e0e0e0;
        margin-bottom: 40px;
        border-bottom: 2px solid #2a3a4f;
        padding-bottom: 30px;
      }

      .header h1 {
        font-size: 2.8rem;
        margin-bottom: 10px;
        color: #00adb5;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .header p {
        font-size: 1.1rem;
        color: #a0a0a0;
        margin-bottom: 30px;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .stat-item {
        background: #1a2332;
        border: 2px solid #2a3a4f;
        padding: 20px 30px;
        border-radius: 8px;
        min-width: 200px;
        transition: border-color 0.3s ease;
      }

      .stat-item:hover {
        border-color: #00adb5;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #00adb5;
        font-family: "Courier New", monospace;
      }

      .stat-label {
        font-size: 0.85rem;
        color: #808080;
        margin-top: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .card {
        background: #1a2332;
        border-radius: 8px;
        padding: 40px;
        border: 1px solid #2a3a4f;
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
      }

      .upload-area {
        border: 2px dashed #00adb5;
        border-radius: 8px;
        padding: 60px 20px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.3s ease,
          background-color 0.3s ease;
        background: #25354a;
        position: relative;
      }

      .upload-area:hover {
        border-color: #00d4db;
        background: #2a3f52;
      }

      .upload-area.dragover {
        border-color: #00d4db;
        background: #2f4a5a;
        box-shadow: inset 0 0 10px rgba(0, 173, 181, 0.2);
      }

      .upload-icon {
        font-size: 3.5rem;
        margin-bottom: 20px;
      }

      .upload-text {
        font-size: 1.2rem;
        color: #00adb5;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .upload-subtext {
        color: #707070;
        font-size: 0.9rem;
      }

      .file-input {
        display: none;
      }

      .button {
        background: #00adb5;
        color: #0f1419;
        border: none;
        padding: 15px 40px;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .button:hover {
        background: #00d4db;
      }

      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .button span {
        position: relative;
        z-index: 1;
      }

      .button-secondary {
        background: #4a5568;
        color: #e0e0e0;
      }

      .button-secondary:hover {
        background: #5a6578;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .preview-item {
        background: #25354a;
        border-radius: 8px;
        padding: 15px;
        position: relative;
        transition: border-color 0.3s ease;
        border: 2px solid #2a3a4f;
      }

      .preview-item:hover {
        border-color: #00adb5;
      }

      .preview-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 10px;
        transition: opacity 0.3s ease;
      }

      .preview-item:hover .preview-image {
        opacity: 0.8;
      }

      .preview-name {
        font-size: 0.85rem;
        color: #00adb5;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }

      .remove-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #dc2626;
        color: white;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        transition: background-color 0.3s ease;
        z-index: 10;
      }

      .remove-btn:hover {
        background: #b91c1c;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 25px;
        margin-top: 30px;
      }

      .result-card {
        background: #25354a;
        border-radius: 8px;
        padding: 20px;
        border: 2px solid #2a3a4f;
        transition: border-color 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .result-card.viral {
        border-color: #dc2626;
      }

      .result-card.normal {
        border-color: #00adb5;
      }

      .result-card:hover {
        border-color: #00adb5;
      }

      .result-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 15px;
        transition: opacity 0.3s ease;
        cursor: pointer;
      }

      .result-card:hover .result-image {
        opacity: 0.8;
      }

      .result-label {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .result-label.viral {
        color: #dc2626;
      }

      .result-label.normal {
        color: #00adb5;
      }

      .confidence-bar {
        width: 100%;
        height: 8px;
        background: #1a2332;
        border-radius: 4px;
        overflow: hidden;
        margin: 10px 0;
        position: relative;
        border: 1px solid #2a3a4f;
      }

      .confidence-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s ease-out;
      }

      .confidence-fill.viral {
        background: #dc2626;
      }

      .confidence-fill.normal {
        background: #00adb5;
      }

      .confidence-text {
        font-size: 0.9rem;
        color: #a0a0a0;
        margin-top: 5px;
        font-weight: 600;
        font-family: "Courier New", monospace;
      }

      .probabilities {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #2a3a4f;
      }

      .prob-item {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 0.9rem;
        padding: 5px;
        border-radius: 4px;
      }

      .prob-label {
        color: #a0a0a0;
        font-weight: 500;
      }

      .prob-value {
        font-weight: 700;
        color: #00adb5;
        font-family: "Courier New", monospace;
      }

      .loading {
        text-align: center;
        padding: 40px;
      }

      .spinner {
        border: 4px solid #2a3a4f;
        border-top: 4px solid #00adb5;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      .loading-text {
        color: #a0a0a0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .error {
        background: #7f1d1d;
        color: #fca5a5;
        padding: 15px 20px;
        border-radius: 4px;
        margin-top: 20px;
        text-align: center;
        border: 1px solid #dc2626;
      }

      .info-section {
        background: #25354a;
        border-radius: 8px;
        padding: 25px;
        margin-top: 20px;
        border: 2px solid #2a3a4f;
      }

      .info-section h3 {
        color: #00adb5;
        margin-bottom: 15px;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .info-section ul {
        list-style: none;
        padding-left: 0;
      }

      .info-section li {
        padding: 10px 0;
        color: #a0a0a0;
        font-weight: 500;
      }

      .info-section li:before {
        content: "→ ";
        color: #00adb5;
        font-weight: bold;
        margin-right: 8px;
      }

      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-top: 10px;
        margin-right: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .badge.accuracy {
        background: #00adb5;
        color: #0f1419;
      }

      .badge.warning {
        background: #f59e0b;
        color: #0f1419;
      }

      .badge.danger {
        background: #dc2626;
        color: #ffffff;
      }

      .medical-cross {
        display: inline-block;
      }

      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
      }

      .modal-content {
        background: #1a2332;
        border-radius: 8px;
        max-width: 900px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        border: 1px solid #2a3a4f;
      }

      .modal-header {
        padding: 25px;
        background: #25354a;
        color: #00adb5;
        border-radius: 8px 8px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #2a3a4f;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 1.5rem;
      }

      .modal-close {
        background: transparent;
        border: 2px solid #00adb5;
        color: #00adb5;
        width: 35px;
        height: 35px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .modal-close:hover {
        background: #00adb5;
        color: #0f1419;
      }

      .modal-body {
        padding: 25px;
      }

      .detail-image {
        width: 100%;
        border-radius: 6px;
        margin-bottom: 20px;
        border: 1px solid #2a3a4f;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
      }

      .detail-item {
        background: #25354a;
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #00adb5;
        border: 1px solid #2a3a4f;
        border-left: 3px solid #00adb5;
      }

      .detail-item.viral {
        border-left-color: #dc2626;
      }

      .detail-label {
        font-size: 0.8rem;
        color: #808080;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail-value {
        font-size: 1.2rem;
        font-weight: 700;
        color: #00adb5;
        font-family: "Courier New", monospace;
      }

      .detail-item.viral .detail-value {
        color: #dc2626;
      }

      /* Heatmap Overlay */
      .heatmap-container {
        position: relative;
        margin-top: 20px;
      }

      .heatmap-legend {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        padding: 10px;
        background: #25354a;
        border-radius: 4px;
        border: 1px solid #2a3a4f;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.85rem;
        color: #a0a0a0;
      }

      .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 3px;
      }

      /* Timeline */
      .analysis-timeline {
        margin-top: 20px;
        padding: 20px;
        background: #25354a;
        border-radius: 6px;
        border: 1px solid #2a3a4f;
      }

      .timeline-item {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #2a3a4f;
      }

      .timeline-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .timeline-icon {
        width: 40px;
        height: 40px;
        background: #00adb5;
        color: #0f1419;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
        font-weight: bold;
      }

      .timeline-content {
        flex: 1;
      }

      .timeline-title {
        font-weight: 600;
        color: #00adb5;
        margin-bottom: 5px;
      }

      .timeline-text {
        font-size: 0.9rem;
        color: #a0a0a0;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 2rem;
        }
        .stats-bar {
          flex-direction: column;
          gap: 15px;
        }
        .card {
          padding: 25px;
        }
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .comparison-container {
          grid-template-columns: 1fr;
        }
        .results-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      function App() {
        const [files, setFiles] = useState([]);
        const [results, setResults] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        const [dragOver, setDragOver] = useState(false);
        const [totalAnalyzed, setTotalAnalyzed] = useState(0);
        const [viralDetected, setViralDetected] = useState(0);
        const [selectedResult, setSelectedResult] = useState(null);
        const [showHeatmap, setShowHeatmap] = useState(false);
        const fileInputRef = useRef(null);

        const API_URL = "http://localhost:5000";

        useEffect(() => {
          if (results.length > 0) {
            const viral = results.filter(
              (r) => r.prediction === "Viral Pneumonia",
            ).length;
            setViralDetected(viral);
          }
        }, [results]);

        const handleFileSelect = (event) => {
          const selectedFiles = Array.from(event.target.files);
          addFiles(selectedFiles);
        };

        const addFiles = (newFiles) => {
          const imageFiles = newFiles.filter((file) =>
            file.type.startsWith("image/"),
          );

          const filesWithPreviews = imageFiles.map((file) => ({
            file,
            preview: URL.createObjectURL(file),
            name: file.name,
          }));

          setFiles((prev) => [...prev, ...filesWithPreviews]);
          setResults([]);
          setError(null);
        };

        const removeFile = (index) => {
          setFiles((prev) => {
            const newFiles = [...prev];
            URL.revokeObjectURL(newFiles[index].preview);
            newFiles.splice(index, 1);
            return newFiles;
          });
        };

        const handleDragOver = (e) => {
          e.preventDefault();
          setDragOver(true);
        };

        const handleDragLeave = () => {
          setDragOver(false);
        };

        const handleDrop = (e) => {
          e.preventDefault();
          setDragOver(false);
          const droppedFiles = Array.from(e.dataTransfer.files);
          addFiles(droppedFiles);
        };

        const handlePredict = async () => {
          if (files.length === 0) return;

          setLoading(true);
          setError(null);
          setResults([]);

          const formData = new FormData();
          files.forEach(({ file }) => {
            formData.append("images", file);
          });

          try {
            const response = await fetch(`${API_URL}/predict`, {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              throw new Error("Prediction failed");
            }

            const data = await response.json();

            // Update total analyzed count once
            setTotalAnalyzed((prev) => prev + data.results.length);

            // Animate results appearing
            data.results.forEach((result, index) => {
              setTimeout(() => {
                setResults((prev) => [...prev, result]);
              }, index * 200);
            });
          } catch (err) {
            setError(
              "Failed to analyze images. Make sure the server is running on port 5000.",
            );
            console.error(err);
          } finally {
            setLoading(false);
          }
        };

        const clearAll = () => {
          files.forEach(({ preview }) => URL.revokeObjectURL(preview));
          setFiles([]);
          setResults([]);
          setError(null);
        };

        const openDetailModal = (result) => {
          setSelectedResult(result);
        };

        const closeDetailModal = () => {
          setSelectedResult(null);
          setShowHeatmap(false);
        };

        const getConfidenceLevel = (confidence) => {
          if (confidence >= 90) return { text: "Very High", color: "#00adb5" };
          if (confidence >= 75) return { text: "High", color: "#00adb5" };
          if (confidence >= 60) return { text: "Moderate", color: "#f59e0b" };
          return { text: "Low", color: "#dc2626" };
        };

        const getRiskLevel = (result) => {
          if (
            result.prediction === "Viral Pneumonia" &&
            result.confidence >= 80
          ) {
            return { text: "High Risk", color: "#dc2626", icon: "⚠️" };
          } else if (
            result.prediction === "Viral Pneumonia" &&
            result.confidence >= 60
          ) {
            return { text: "Moderate Risk", color: "#f59e0b", icon: "⚠️" };
          } else if (result.prediction === "Viral Pneumonia") {
            return { text: "Low Risk", color: "#00adb5", icon: "ℹ️" };
          }
          return { text: "Normal", color: "#00adb5", icon: "✅" };
        };

        return (
          <div className="container">
            <div className="header">
              <h1>
                <span className="medical-cross">🫁</span> Pneumonia Detection AI
              </h1>
              <p>Advanced medical imaging analysis powered by deep learning</p>

              <div className="stats-bar">
                <div className="stat-item">
                  <div className="stat-value">{totalAnalyzed}</div>
                  <div className="stat-label">Total Analyzed</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{viralDetected}</div>
                  <div className="stat-label">Viral Cases Detected</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{results.length}</div>
                  <div className="stat-label">Current Batch</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">95%</div>
                  <div className="stat-label">Model Accuracy</div>
                </div>
              </div>
            </div>

            <div className="card">
              <div
                className={`upload-area ${dragOver ? "dragover" : ""}`}
                onClick={() => fileInputRef.current?.click()}
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
              >
                <div className="upload-icon">📁</div>
                <div className="upload-text">
                  Click to upload or drag and drop
                </div>
                <div className="upload-subtext">
                  Support for multiple chest X-ray images (PNG, JPG, JPEG)
                </div>
                <input
                  ref={fileInputRef}
                  type="file"
                  className="file-input"
                  accept="image/*"
                  multiple
                  onChange={handleFileSelect}
                />
              </div>

              {files.length > 0 && (
                <>
                  <div className="preview-grid">
                    {files.map((file, index) => (
                      <div key={index} className="preview-item">
                        <button
                          className="remove-btn"
                          onClick={(e) => {
                            e.stopPropagation();
                            removeFile(index);
                          }}
                        >
                          ×
                        </button>
                        <img
                          src={file.preview}
                          alt={file.name}
                          className="preview-image"
                        />
                        <div className="preview-name">{file.name}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ textAlign: "center", marginTop: "30px" }}>
                    <button
                      className="button"
                      onClick={handlePredict}
                      disabled={loading}
                      style={{ marginRight: "15px" }}
                    >
                      <span>
                        {loading
                          ? "Analyzing..."
                          : `🔬 Analyze ${files.length} Image${files.length > 1 ? "s" : ""}`}
                      </span>
                    </button>
                    <button
                      className="button button-secondary"
                      onClick={clearAll}
                    >
                      <span>Clear All</span>
                    </button>
                  </div>
                </>
              )}

              {loading && (
                <div className="loading">
                  <div className="spinner"></div>
                  <p className="loading-text">Analyzing images with AI...</p>
                  <div className="progress-indicator">
                    <div className="progress-dot"></div>
                    <div className="progress-dot"></div>
                    <div className="progress-dot"></div>
                  </div>
                </div>
              )}

              {error && <div className="error">⚠️ {error}</div>}
            </div>

            {results.length > 0 && (
              <>
                <div className="card">
                  <h2
                    style={{
                      color: "#00adb5",
                      marginBottom: "20px",
                      display: "flex",
                      alignItems: "center",
                      gap: "10px",
                    }}
                  >
                    📊 Analysis Results ({results.length} image
                    {results.length > 1 ? "s" : ""})
                  </h2>

                  <div className="results-grid">
                    {results.map((result, index) => {
                      const isViral = result.prediction === "Viral Pneumonia";
                      const confidenceLevel = getConfidenceLevel(
                        result.confidence,
                      );
                      const riskLevel = getRiskLevel(result);

                      return (
                        <div
                          key={index}
                          className={`result-card ${isViral ? "viral" : "normal"}`}
                        >
                          <img
                            src={result.image_preview}
                            alt={result.filename}
                            className="result-image"
                            onClick={() => openDetailModal(result)}
                          />
                          <div
                            className="preview-name"
                            style={{ marginBottom: "10px" }}
                          >
                            {result.filename}
                          </div>
                          <div
                            className={`result-label ${isViral ? "viral" : "normal"}`}
                          >
                            {riskLevel.icon} {result.prediction}
                          </div>
                          <div className="confidence-bar">
                            <div
                              className={`confidence-fill ${isViral ? "viral" : "normal"}`}
                              style={{ width: `${result.confidence}%` }}
                            ></div>
                          </div>
                          <div className="confidence-text">
                            Confidence: {result.confidence}%
                          </div>

                          <div style={{ marginTop: "10px" }}>
                            <span className="badge accuracy">
                              {confidenceLevel.text} Confidence
                            </span>
                            {isViral && result.confidence >= 75 && (
                              <span className="badge danger">
                                {riskLevel.text}
                              </span>
                            )}
                          </div>

                          <div className="probabilities">
                            <div className="prob-item">
                              <span className="prob-label">Normal/Other:</span>
                              <span className="prob-value">
                                {result.probabilities["Normal/Other"]}%
                              </span>
                            </div>
                            <div className="prob-item">
                              <span className="prob-label">
                                Viral Pneumonia:
                              </span>
                              <span className="prob-value">
                                {result.probabilities["Viral Pneumonia"]}%
                              </span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

            {selectedResult && (
              <div className="modal-overlay" onClick={closeDetailModal}>
                <div
                  className="modal-content"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="modal-header">
                    <h2>📋 Detailed Analysis</h2>
                    <button className="modal-close" onClick={closeDetailModal}>
                      ×
                    </button>
                  </div>
                  <div className="modal-body">
                    <h3 style={{ color: "#00adb5", marginBottom: "15px" }}>
                      {selectedResult.filename}
                    </h3>

                    <div className="heatmap-container">
                      <img
                        src={
                          showHeatmap
                            ? selectedResult.heatmap_overlay
                            : selectedResult.image_preview
                        }
                        alt={selectedResult.filename}
                        className="detail-image"
                      />
                      {showHeatmap && (
                        <div className="heatmap-legend">
                          <div className="legend-item">
                            <div
                              className="legend-color"
                              style={{ background: "rgba(255, 0, 0, 0.8)" }}
                            ></div>
                            <span>High Attention (Red)</span>
                          </div>
                          <div className="legend-item">
                            <div
                              className="legend-color"
                              style={{ background: "rgba(255, 165, 0, 0.8)" }}
                            ></div>
                            <span>Medium Attention (Orange)</span>
                          </div>
                          <div className="legend-item">
                            <div
                              className="legend-color"
                              style={{ background: "rgba(0, 0, 255, 0.8)" }}
                            ></div>
                            <span>Low Attention (Blue)</span>
                          </div>
                        </div>
                      )}
                    </div>

                    {selectedResult.heatmap_overlay && (
                      <div style={{ textAlign: "center", marginTop: "15px" }}>
                        <button
                          className="button"
                          onClick={() => setShowHeatmap(!showHeatmap)}
                          style={{ padding: "10px 25px", fontSize: "0.95rem" }}
                        >
                          <span>
                            {showHeatmap
                              ? "👁️ Hide Heatmap"
                              : "🔥 Show AI Attention Heatmap"}
                          </span>
                        </button>
                        <p
                          style={{
                            marginTop: "10px",
                            fontSize: "0.85rem",
                            color: "#6b7280",
                          }}
                        >
                          Grad-CAM visualization showing which areas the AI
                          model focused on
                        </p>
                      </div>
                    )}

                    <div className="detail-grid">
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">Prediction</div>
                        <div className="detail-value">
                          {selectedResult.prediction}
                        </div>
                      </div>
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">Confidence</div>
                        <div className="detail-value">
                          {selectedResult.confidence}%
                        </div>
                      </div>
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">
                          Normal/Other Probability
                        </div>
                        <div className="detail-value">
                          {selectedResult.probabilities["Normal/Other"]}%
                        </div>
                      </div>
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">
                          Viral Pneumonia Probability
                        </div>
                        <div className="detail-value">
                          {selectedResult.probabilities["Viral Pneumonia"]}%
                        </div>
                      </div>
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">Risk Level</div>
                        <div className="detail-value">
                          {getRiskLevel(selectedResult).text}
                        </div>
                      </div>
                      <div
                        className={`detail-item ${selectedResult.prediction === "Viral Pneumonia" ? "viral" : ""}`}
                      >
                        <div className="detail-label">Confidence Level</div>
                        <div className="detail-value">
                          {getConfidenceLevel(selectedResult.confidence).text}
                        </div>
                      </div>
                    </div>

                    <div className="analysis-timeline">
                      <h4 style={{ color: "#00adb5", marginBottom: "15px" }}>
                        Analysis Process
                      </h4>
                      <div className="timeline-item">
                        <div className="timeline-icon">📤</div>
                        <div className="timeline-content">
                          <div className="timeline-title">Image Upload</div>
                          <div className="timeline-text">
                            X-ray image received and preprocessed
                          </div>
                        </div>
                      </div>
                      <div className="timeline-item">
                        <div className="timeline-icon">🔬</div>
                        <div className="timeline-content">
                          <div className="timeline-title">AI Analysis</div>
                          <div className="timeline-text">
                            ResNet18 model processed the image
                          </div>
                        </div>
                      </div>
                      <div className="timeline-item">
                        <div className="timeline-icon">📊</div>
                        <div className="timeline-content">
                          <div className="timeline-title">
                            Results Generated
                          </div>
                          <div className="timeline-text">
                            Prediction: {selectedResult.prediction} (
                            {selectedResult.confidence}% confidence)
                          </div>
                        </div>
                      </div>
                      <div className="timeline-item">
                        <div className="timeline-icon">✅</div>
                        <div className="timeline-content">
                          <div className="timeline-title">
                            Analysis Complete
                          </div>
                          <div className="timeline-text">
                            Results ready for review
                          </div>
                        </div>
                      </div>
                    </div>

                    <div
                      style={{
                        marginTop: "20px",
                        padding: "15px",
                        background: "#fff3cd",
                        borderRadius: "10px",
                        border: "2px solid #ffc107",
                      }}
                    >
                      <p
                        style={{
                          color: "#856404",
                          fontSize: "0.9rem",
                          margin: 0,
                        }}
                      >
                        <strong>⚠️ Important:</strong> This analysis is for
                        research and educational purposes only. Always consult
                        qualified healthcare professionals for medical diagnosis
                        and treatment decisions.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="card">
              <div className="info-section">
                <h3>
                  <span className="medical-cross">ℹ️</span> About This Tool
                </h3>
                <ul>
                  <li>
                    AI model trained on COVID-19 Radiography Database with 95%
                    accuracy
                  </li>
                  <li>
                    Detects Viral Pneumonia patterns in chest X-ray images
                  </li>
                  <li>
                    ResNet18 deep learning architecture optimized for medical
                    imaging
                  </li>
                  <li>
                    Real-time batch processing with detailed confidence metrics
                  </li>
                  <li>
                    For research and educational purposes only - not for
                    clinical diagnosis
                  </li>
                </ul>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
